<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monolithic App - Python</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #e8e8e8;
            box-shadow: none;
        }
        .btn-danger {
            background: #dc3545;
        }
        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background: #d1fae5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }
        .user-info {
            text-align: center;
        }
        .user-info .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
            font-weight: bold;
        }
        .user-info h2 {
            color: #333;
            margin-bottom: 5px;
        }
        .user-info p {
            color: #666;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e1e1e1;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            transition: color 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .password-requirements {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth-section">
            <h1>Welcome</h1>
            <p class="subtitle">Sign in to continue or create a new account</p>
            
            <div id="alert" class="alert hidden"></div>
            
            <div class="tabs">
                <div class="tab active" data-tab="login">Login</div>
                <div class="tab" data-tab="register">Register</div>
            </div>
            
            <div id="login-form" class="tab-content active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="login-btn">Sign In</button>
                </form>
            </div>
            
            <div id="register-form" class="tab-content">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="register-name">Full Name</label>
                        <input type="text" id="register-name" placeholder="Enter your full name" required minlength="2">
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" placeholder="Create a password" required minlength="8">
                        <p class="password-requirements">
                            Min 8 characters with uppercase, lowercase, number, and special character
                        </p>
                    </div>
                    <button type="submit" id="register-btn">Create Account</button>
                </form>
            </div>
        </div>
        
        <div id="user-section" class="user-info hidden">
            <div class="avatar" id="user-avatar">U</div>
            <h2 id="user-name">User Name</h2>
            <p id="user-email">user@example.com</p>
            <p id="user-created" style="font-size: 12px; color: #999;"></p>
            <button class="btn-danger" onclick="handleLogout()">Sign Out</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api/auth';
        
        function getToken() {
            return localStorage.getItem('access_token');
        }
        
        function setToken(token) {
            localStorage.setItem('access_token', token);
        }
        
        function clearToken() {
            localStorage.removeItem('access_token');
        }
        
        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.classList.remove('hidden');
            setTimeout(() => alert.classList.add('hidden'), 5000);
        }
        
        function extractErrorMessage(detail) {
            if (typeof detail === 'string') {
                return detail;
            }
            if (Array.isArray(detail) && detail.length > 0) {
                const firstError = detail[0];
                if (firstError.msg) {
                    return firstError.msg;
                }
                return JSON.stringify(firstError);
            }
            if (typeof detail === 'object' && detail !== null) {
                return detail.msg || detail.message || JSON.stringify(detail);
            }
            return 'An error occurred';
        }
        
        function setLoading(buttonId, loading) {
            const btn = document.getElementById(buttonId);
            btn.disabled = loading;
            btn.textContent = loading ? 'Please wait...' : btn.dataset.text || btn.textContent;
            if (!loading) btn.dataset.text = btn.textContent;
        }
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}-form`).classList.add('active');
            });
        });
        
        async function handleRegister(event) {
            event.preventDefault();
            setLoading('register-btn', true);
            
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            
            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    const errorMsg = extractErrorMessage(data.detail) || 'Registration failed';
                    throw new Error(errorMsg);
                }
                
                showAlert('Account created successfully! Please sign in.', 'success');
                document.querySelector('[data-tab="login"]').click();
                document.getElementById('login-email').value = email;
            } catch (error) {
                showAlert(error.message);
            } finally {
                setLoading('register-btn', false);
            }
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            setLoading('login-btn', true);
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    const errorMsg = extractErrorMessage(data.detail) || 'Login failed';
                    throw new Error(errorMsg);
                }
                
                setToken(data.access_token);
                await loadUserProfile();
            } catch (error) {
                showAlert(error.message);
            } finally {
                setLoading('login-btn', false);
            }
        }
        
        async function loadUserProfile() {
            const token = getToken();
            if (!token) {
                showAuthSection();
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) {
                    clearToken();
                    showAuthSection();
                    return;
                }
                
                const user = await response.json();
                showUserSection(user);
            } catch (error) {
                clearToken();
                showAuthSection();
            }
        }
        
        function showAuthSection() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('user-section').classList.add('hidden');
        }
        
        function showUserSection(user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('user-section').classList.remove('hidden');
            
            document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-email').textContent = user.email;
            
            const createdDate = new Date(user.created_at).toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
            document.getElementById('user-created').textContent = `Member since ${createdDate}`;
        }
        
        function handleLogout() {
            clearToken();
            showAuthSection();
            showAlert('You have been signed out.', 'success');
        }
        
        document.addEventListener('DOMContentLoaded', loadUserProfile);
    </script>
</body>
</html>
