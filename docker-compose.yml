services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: monolithic_app_db
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  nodejs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USER: appuser
      DB_PW: apppassword
      MONGODB_HOST: mongodb
      OTEL_SERVICE_NAME: nodejs-monolithic-app
      OTEL_ENVIRONMENT: ${ENVIRONMENT:-docker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp.playerzero.app}
      PLAYERZERO_API_KEY: ${PLAYERZERO_API_KEY:-}
      PLAYERZERO_PROJECT_ID: ${PLAYERZERO_PROJECT_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  python-app:
    build:
      context: ./python_app
      dockerfile: Dockerfile
    container_name: python-app
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      MONGODB_URL: mongodb://appuser:apppassword@mongodb:27017/monolithic_app_db?authSource=monolithic_app_db
      DATABASE_NAME: monolithic_app_db
      SECRET_KEY: your-super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      HOST: 0.0.0.0
      PORT: 8080
      DEBUG: "false"
      OTEL_SERVICE_NAME: python-monolithic-app
      OTEL_ENVIRONMENT: ${ENVIRONMENT:-docker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp.playerzero.app}
      PLAYERZERO_API_KEY: ${PLAYERZERO_API_KEY:-}
      PLAYERZERO_PROJECT_ID: ${PLAYERZERO_PROJECT_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
